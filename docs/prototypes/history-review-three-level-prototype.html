<script>
const task=(id,name,kind,ps,pe,as,ae)=>({id,name,kind,ps,pe,as,ae});
const simple=(id,name,plan,actual,start,devEnd,testStart)=>({id,name,plan,actual,tasks:[task(id+'a','客户端','dev',start,devEnd,start,devEnd),task(id+'b','功能测试','test',testStart,plan,testStart,actual||'')]});
const versions=[
  {id:'v26',name:'V2.6.0',line:'交易线',start:'2026-08-03',plan:'2026-09-15',release:'2026-09-15',selected:true,req:[simple('a','结算体验优化','2026-09-10','2026-09-10','2026-08-10','2026-08-27','2026-09-01'),simple('b','商城推荐改版','2026-09-12','2026-09-12','2026-08-12','2026-09-05','2026-09-07'),simple('c','跨区匹配体验','2026-09-14','2026-09-14','2026-08-18','2026-09-04','2026-09-07')]},
  {id:'v25',name:'V2.5.0',line:'交易线',start:'2026-05-25',plan:'2026-07-02',release:'2026-07-15',selected:true,req:[simple('d','交易路由调整','2026-07-02','2026-07-10','2026-06-01','2026-07-01','2026-07-02'),simple('e','礼包展示优化','2026-07-08','2026-07-08','2026-06-09','2026-06-30','2026-07-02'),simple('f','支付异常治理','2026-07-10','','2026-06-12','2026-07-04','2026-07-05')]},
  {id:'v24',name:'V2.4.0',line:'交易线',start:'2026-04-01',plan:'2026-05-10',release:'2026-05-16',selected:true,calendar:{holiday:['2026-05-01'],special:['2026-05-09','2026-05-16']},req:[
    {id:'g',name:'购物车改版',plan:'2026-05-10',actual:'2026-05-16',reason:'联调测试环境较计划晚开放，测试窗口顺延。',cause:'外部依赖',stage:'开发衔接／测试',evidence:'演示工单 #TB-1187 联调反馈与状态记录',tasks:[task('g1','UI 设计','art','2026-04-01','2026-04-13','2026-04-02','2026-04-15'),task('g6','美术资源','art','2026-04-02','2026-04-13','2026-04-01','2026-04-15'),task('g7','动效','art','2026-04-11','2026-04-18','2026-04-08','2026-04-17'),task('g3','服务端','dev','2026-04-13','2026-04-29','2026-04-13','2026-05-06'),task('g2','客户端','dev','2026-04-13','2026-04-30','2026-04-15','2026-05-06'),task('g8','KGUI','dev','2026-04-15','2026-04-30','2026-04-16','2026-05-04'),task('g9','后台','dev','2026-04-15','2026-04-29','2026-04-15','2026-04-30'),task('g10','数值','dev','2026-04-18','2026-04-22','2026-04-18','2026-04-23'),task('g4','功能测试','test','2026-05-04','2026-05-10','2026-05-08','2026-05-14'),task('g5','验收总单','accept','2026-05-10','2026-05-10','2026-05-15','2026-05-16')]},
    simple('h','结算页性能优化','2026-05-08','2026-05-08','2026-04-07','2026-04-29','2026-04-30'),
    {id:'i',name:'新手引导重构',plan:'2026-05-06',actual:'2026-05-09',corrected:true,reason:'旧引导逻辑组合的边界估计不足，客户端重构范围扩大。',cause:'估算偏差',stage:'开发',evidence:'演示工单 #TB-1193 范围变更与状态记录',tasks:[task('i1','UI 设计','art','2026-04-01','2026-04-12','2026-04-01','2026-04-14'),task('i2','客户端','dev','2026-04-13','2026-04-30','2026-04-15','2026-05-05'),task('i3','KGUI','dev','2026-04-15','2026-04-30','2026-04-16','2026-05-04'),task('i4','功能测试','test','2026-05-01','2026-05-06','2026-05-06','2026-05-09')]}
  ]},
  {id:'v23',name:'V2.3.0',line:'战斗线',start:'2026-01-20',plan:'2026-03-05',release:'2026-03-05',selected:true,req:[simple('j','公会战体验','2026-03-04','2026-03-04','2026-02-02','2026-02-23','2026-02-25'),simple('k','战斗播报','2026-03-05','2026-03-05','2026-02-02','2026-02-18','2026-02-25')]},
  {id:'hot',name:'V2.4.1 热更',line:'交易线',start:'2026-05-18',plan:'2026-05-20',release:'2026-05-20',selected:false,req:[]}
];
const date=s=>new Date(`${s}T00:00:00Z`),short=s=>s?s.slice(5):'—',next=(s,n)=>new Date(date(s).getTime()+n*86400000).toISOString().slice(0,10);
function range(a,b){if(!a||!b||b<a)return[];const out=[];for(let d=a;d<=b;d=next(d,1))out.push(d);return out}
function working(v,d){if(v.calendar?.special?.includes(d))return true;if(v.calendar?.holiday?.includes(d))return false;return ![0,6].includes(date(d).getUTCDay())}
const workdays=(v,a,b)=>range(a,b).filter(d=>working(v,d)).length;
const delay=(v,plan,actual)=>plan&&actual&&actual>plan?workdays(v,next(plan,1),actual):0;
const badge=(v,plan,actual)=>!plan||!actual?'':delay(v,plan,actual)?`<span class="pill late">延期 ${delay(v,plan,actual)} 工作日</span>`:'<span class="pill good">按时</span>';
const state={page:'overview',version:'v24',requirement:'i',year:'2026'};
const version=()=>versions.find(v=>v.id===state.version)||versions[2],requirement=()=>version().req.find(r=>r.id===state.requirement)||version().req[0];
function phase(v,r,kind){const items=r.tasks.filter(t=>kind==='dev'?['art','dev'].includes(t.kind):t.kind==='test'),start=items.map(t=>t.as).filter(Boolean).sort()[0],finish=items.length&&items.every(t=>t.ae)?items.map(t=>t.ae).sort().at(-1):'';return {start,finish,text:start&&finish?`${workdays(v,start,finish)} 工作日`:start?'—':'不适用'}}
const headerNote=()=>`<div class="purpose">本看板只用于版本结束复盘、延期原因核对与交付争议说明。仅汇总已选入留档并确认上线的版本；不用于人员排名、绩效评分或重算整体健康度。所有日期、工单、原因均为演示数据。</div>`;
const crumbs=(v,r)=>`<div class="crumbs"><button class="link" data-page="overview">版本总览</button>${v?`<span>/</span>${r?`<button class="link" data-page="version">${v.name}</button>`:`<b>${v.name}</b>`}`:''}${r?`<span>/</span><b>${r.name}</b>`:''}</div>`;
function overview(){const list=versions.filter(v=>v.selected&&v.release&&(state.year==='全部年份'||v.release.slice(0,4)===state.year)),cycles=list.filter(v=>v.start),onTime=list.filter(v=>v.plan&&v.release<=v.plan).length,rateBase=list.filter(v=>v.plan),needs=list.flatMap(v=>v.req.map(r=>({v,r}))).filter(x=>x.r.plan),done=needs.filter(x=>x.r.actual&&x.r.actual<=x.r.plan).length,median=arr=>{if(!arr.length)return '—';const ordered=[...arr].sort((a,b)=>a-b),mid=Math.floor(ordered.length/2);return (ordered.length%2?ordered[mid]:(ordered[mid-1]+ordered[mid])/2).toFixed(1)};return `${headerNote()}<div class="section-head"><div><h1 style="font-size:21px;margin:0">版本历史数据</h1><div class="sub">版本 → 核心需求 → 环节工单 · 仅统计当前筛选的留档范围</div></div><div class="filters"><select id="year-filter" class="select" aria-label="上线年份"><option>2026</option><option>全部年份</option></select></div></div><div class="metrics"><div class="card"><div class="note">已留档并上线版本</div><div class="metric">${list.length}</div><div class="sub">未选入的热更不计入</div></div><div class="card"><div class="note">版本周期中位数</div><div class="metric">${median(cycles.map(v=>workdays(v,v.start,v.release)))} <small style="font-size:13px">工作日</small></div><div class="sub">${median(cycles.map(v=>range(v.start,v.release).length))} 自然日 · 可计算 ${cycles.length} / ${list.length}</div></div><div class="card"><div class="note">按时上线版本</div><div class="metric">${rateBase.length?`${onTime} / ${rateBase.length}`:'—'}</div><div class="sub">实际 ≤ 首次计划 · 可比较 ${rateBase.length} / ${list.length}</div></div><div class="card"><div class="note">核心需求按时完成率</div><div class="metric">${needs.length?`${Math.round(done/needs.length*100)}%`:'—'}</div><div class="sub">按时 ${done} / 可比较 ${needs.length} · 空完成时间不计入分子</div></div></div><section class="card"><div class="section-head"><div><div class="section-title">已结束版本列表</div><div class="note">点击版本下钻；Teambition 截止日不是实际上线日</div></div><span class="pill info">只读复盘</span></div><div class="table-scroll"><table><thead><tr><th>版本</th><th>周期（自然日 / 工作日）</th><th>核心需求（完成 / 总数）</th><th>首次计划上线</th><th>实际上线</th><th>结果</th></tr></thead><tbody>${list.map(v=>`<tr data-open-version="${v.id}"><td><b>${v.name}</b><div class="note">${v.line}</div></td><td>${short(v.start)} → ${short(v.release)}<div class="note">${range(v.start,v.release).length} 自然日 · ${workdays(v,v.start,v.release)} 工作日</div></td><td>${v.req.filter(r=>r.actual&&r.actual<=v.release).length} / ${v.req.length}</td><td>${short(v.plan)}</td><td>${short(v.release)}</td><td>${badge(v,v.plan,v.release)}</td></tr>`).join('')||'<tr><td colspan="6">当前筛选范围暂无已上线留档版本。</td></tr>'}</tbody></table></div><div class="footnote">周期首尾日期均计入；工作日按各版本上线时生效的日历计算。按时与延期和首次确认计划比较，改期仅另列记录。</div></section>`}
function versionPage(){const v=version();return `${headerNote()}${crumbs(v)}<div class="section-head"><div><h1 style="font-size:22px;margin:0">${v.name} · 版本详情</h1><div class="sub">${v.line} · 已确认上线 ${short(v.release)} · 截至实际上线时</div></div>${badge(v,v.plan,v.release)}</div><div class="metrics"><div class="card"><div class="note">版本周期</div><div class="metric">${workdays(v,v.start,v.release)} <small style="font-size:13px">工作日</small></div><div class="sub">${range(v.start,v.release).length} 自然日 · ${short(v.start)} → ${short(v.release)}</div></div><div class="card"><div class="note">计划开始时间</div><div class="metric">${short(v.start)}</div><div class="sub">不等同于系统同步起点</div></div><div class="card"><div class="note">计划上线时间</div><div class="metric">${short(v.plan)}</div><div class="sub">纳入管理时确认 · 修订另留痕</div></div><div class="card"><div class="note">实际上线时间</div><div class="metric">${short(v.release)}</div><div class="sub">版本负责人确认${delay(v,v.plan,v.release)?` · 晚 ${delay(v,v.plan,v.release)} 工作日`:''}</div></div></div><section class="card"><div class="section-title">核心需求（${v.req.length} 项，点击进入需求详情）</div><div class="req-list" style="margin-top:12px">${v.req.map(r=>`<button type="button" class="req-row" data-open-requirement="${r.id}"><span class="req-name">${r.name}</span><span class="req-middle"><span>开发 ${phase(v,r,'dev').text} · 测试 ${phase(v,r,'test').text}</span><span>计划 ${short(r.plan)} → 实际 ${short(r.actual)}</span></span><span class="req-result">${badge(v,r.plan,r.actual)}${r.cause?`<span class="note">${r.cause}</span>`:''}</span></button>`).join('')}</div></section><div class="footnote version-review-note">开发阶段周期采用包络口径：核心专业子单首次实际开始 → 最后实际完成，包含等待和并行；测试、验收分开。计划基线在纳入管理时确认，实际上线由版本负责人确认；漏同步修正须留痕。</div>`}
function timeline(v,r){
  const tasks=r.tasks;
  const from=tasks.flatMap(t=>[t.ps,t.as]).filter(Boolean).sort()[0];
  const to=[...tasks.flatMap(t=>[t.pe,t.ae]),r.plan,r.actual].filter(Boolean).sort().at(-1);
  const days=range(from,to),cell=37,label=118,width=days.length*cell,index=d=>days.indexOf(d);
  const weeks=[];let groupStart=0;
  days.forEach((d,i)=>{if(date(d).getUTCDay()===0||i===days.length-1){weeks.push({start:days[groupStart],end:d,count:i-groupStart+1});groupStart=i+1}});
  const off=d=>working(v,d)?'':'weekend',special=d=>v.calendar?.special?.includes(d)?'special':'';
  const bodyCells=days.map(d=>`<div class="day ${off(d)} ${special(d)}"></div>`).join('');
  const weekLabels=weeks.map((w,i)=>`<div class="week" style="width:${w.count*cell}px">W${i+1} · ${Number(w.start.slice(5,7))}/${Number(w.start.slice(8))} - ${Number(w.end.slice(5,7))}/${Number(w.end.slice(8))}</div>`).join('');
  const headerDays=days.map(d=>`<div class="day ${off(d)} ${special(d)}"><em>${d.slice(8)}</em><span>${['日','一','二','三','四','五','六'][date(d).getUTCDay()]}${off(d)?' 休':''}</span></div>`).join('');
  const rows=tasks.map(t=>{
    const planLeft=index(t.ps)*cell,planWidth=range(t.ps,t.pe).length*cell;
    const actualLeft=index(t.as)*cell,actualWidth=t.ae?range(t.as,t.ae).length*cell:0;
    const extensionStart=t.ae&&t.pe?Math.max(index(t.pe)+1,index(t.as)):-1;
    const extensionWidth=t.ae&&extensionStart>=0&&index(t.ae)>=extensionStart?(index(t.ae)-extensionStart+1)*cell:0;
    return `<div class="chart-row"><div class="chart-label"><b>${t.name}</b></div><div class="chart-days" style="width:${width}px">${bodyCells}<span class="bar planned" style="left:${planLeft}px;width:${planWidth}px"></span>${actualLeft>=0&&actualWidth?`<span class="bar actual ${t.kind}" style="left:${actualLeft}px;width:${actualWidth}px"></span>`:''}${extensionWidth?`<span class="bar extension" style="left:${extensionStart*cell}px;width:${extensionWidth}px"></span>`:''}</div></div>`
  }).join('');
  const marker=(d,kind,text)=>d&&index(d)>=0?`<div class="completion-marker ${kind}" style="left:${label+(index(d)+.5)*cell}px"><span>${text} ${short(d)}</span></div>`:'';
  const completionMarkers=r.plan&&r.actual&&r.plan===r.actual?marker(r.plan,'actual','计划/实际完成'):marker(r.plan,'planned','计划完成')+marker(r.actual,'actual','实际完成');
  return `<div class="chart-scroll"><div class="chart"><div class="chart-head"><div class="chart-label"><b>环节</b></div><div class="chart-header-days" style="width:${width}px"><div class="week-strip">${weekLabels}</div><div class="chart-days">${headerDays}</div></div></div>${rows}${completionMarkers}</div></div><div class="legend"><span><i class="swatch" style="background:#eceef1;border:1px solid #c6cbd3"></i>计划（基线快照）</span><span><i class="swatch" style="background:#e7aa51"></i>实际 · 资产类</span><span><i class="swatch" style="background:#5b91d6"></i>实际 · 生产类</span><span><i class="swatch" style="background:#4aa17d"></i>实际 · 测试</span><span><i class="swatch" style="background:#8b72b3"></i>实际 · 验收</span><span><i class="swatch" style="background:repeating-linear-gradient(45deg,#f6c5bf 0 4px,#fff4f2 4px 7px)"></i>超出计划期限</span><span>┊　计划完成线</span><span style="color:#a34a4e">┃　实际完成线</span></div><div class="note">时间线可左右滑动查看完整区间；灰色为周末或非工作日、浅紫色为特殊工作日。计划与实际同日完成时合并标记；空白表示环节衔接间隙，不作工单计时历时。</div>`
}
function demandPage(){const v=version(),r=requirement(),dev=phase(v,r,'dev'),testing=phase(v,r,'test'),begin=r.tasks.map(t=>t.as).filter(Boolean).sort()[0],span=r.actual?workdays(v,begin,r.actual):'—';return `${headerNote()}${crumbs(v,r)}<div class="section-head"><div><h1 style="font-size:22px;margin:0">${r.name} · 需求详情</h1><div class="sub">${v.name} · 实际交付完成 ${short(r.actual)} · 截至 ${short(v.release)} 上线</div></div>${badge(v,r.plan,r.actual)}</div><div class="facts"><div class="card"><div class="note">需求周期</div><div class="metric">${span} <small style="font-size:13px">工作日</small></div><div class="sub">实际起点 ${short(begin)} → 实际完成 ${short(r.actual)}</div></div><div class="card"><div class="note">开发阶段周期</div><div class="metric">${dev.text}</div><div class="sub">${short(dev.start)} → ${short(dev.finish)} · 八类核心专业子单</div></div><div class="card"><div class="note">测试阶段周期</div><div class="metric">${testing.text}</div><div class="sub">${short(testing.start)} → ${short(testing.finish)} · 验收另列</div></div><div class="card"><div class="note">计划完成时间</div><div class="metric">${short(r.plan)}</div><div class="sub">纳入管理时确认 · 修改另留痕</div></div><div class="card"><div class="note">实际完成时间</div><div class="metric">${short(r.actual)}</div><div class="sub">${r.actual?delay(v,r.plan,r.actual)?`较基线晚 ${delay(v,r.plan,r.actual)} 工作日`:'较基线按时':'没有可信完成时间'}</div></div></div><section class="card"><div class="section-head"><div><div class="section-title">计划 vs 实际 · 环节时间线（甘特）</div></div></div>${timeline(v,r)}</section><section class="card"><div class="section-head"><div><div class="section-title">原始工作单明细（证据可回溯）</div></div></div><div class="workitem-list-wrap"><table class="workitem-detail-list"><thead><tr><th>环节</th><th>类型</th><th>计划起止</th><th>实际起止</th><th>实际时长</th><th>较计划</th></tr></thead><tbody>${r.tasks.map(t=>`<tr><td>${t.name}</td><td>${{art:'资产类',dev:'生产类',test:'测试',accept:'验收'}[t.kind]}</td><td>${short(t.ps)} → ${short(t.pe)}</td><td>${short(t.as)} → ${short(t.ae)}</td><td>${t.ae?`${workdays(v,t.as,t.ae)} 工作日`:'—'}</td><td>${t.ae?delay(v,t.pe,t.ae)?`+${delay(v,t.pe,t.ae)} 工作日`:'按时':'—'}</td></tr>`).join('')}</tbody></table></div><div class="footnote">工单偏差只用于核对，不能相加为需求总延期。计划起止与实际状态流转分别保留来源。</div></section><div class="reasons"><section class="card"><div class="section-head"><div class="section-title">延期原因 · 复盘登记</div><span class="pill ${r.reason?'good':'warn'}">${r.reason?'管理员已确认':'暂无已确认原因'}</span></div>${r.reason?`<div class="reason"><span class="scope">${r.cause}</span> <span class="note">影响环节：${r.stage}</span><p>${r.reason}</p><div class="note">登记与确认：显式授权的系统管理员（PM） · 演示</div></div><div class="footnote">证据：${r.evidence}。原因由管理员记录，不自动推断个人责任。</div>`:'<div class="mini-note">按时需求可不填写。若延期而原因未确认，应显示“待登记”，不凭日期差自动归责。</div>'}</section><section class="card"><div class="section-head"><div class="section-title">计划、更正与来源</div><span class="pill info">只读示意</span></div><div class="evidence"><div class="evidence-row"><b>首次比较基线</b><br>${short(r.plan)} · 纳入版本管理时确认；改期不覆盖，更正需留痕</div><div class="evidence-row"><b>实际交付完成</b><br>${r.actual?`${short(r.actual)} · 上线前最后一次有效完成`:'— · 不计入按时分子'}</div><div class="evidence-row"><b>历史日历</b><br>采用 ${v.name} 上线时生效的工作日历，不因后续日历调整重算</div>${r.corrected?'<div class="evidence-row"><b>漏同步修正示例</b><br>上线时结果缺失 → 经证据核实补回 05-09；首次记录与修订历史同时保留，指标据核实结果重算。</div>':''}</div></section></div>`}
function syncUrl(){const url=new URL(location.href);url.searchParams.set('page',state.page);url.searchParams.set('version',state.version);url.searchParams.set('requirement',state.requirement);history.replaceState(null,'',url)}
function navigate(page,versionId,requirementId){if(versionId){state.version=versionId;state.requirement=version().req[0].id}if(requirementId)state.requirement=requirementId;if(page)state.page=page;syncUrl();render();scrollTo(0,0)}
function render(){document.getElementById('page-title').textContent={overview:'版本历史数据',version:'历史版本详情',requirement:'历史需求详情'}[state.page];document.getElementById('app').innerHTML={overview,version:versionPage,requirement:demandPage}[state.page]();document.getElementById('step-name').textContent=`${{overview:1,version:2,requirement:3}[state.page]} / 3 · ${{overview:'版本总览',version:'版本详情',requirement:'需求详情'}[state.page]}`;if(state.page==='overview'){document.getElementById('year-filter').value=state.year}}
document.getElementById('app').addEventListener('click',e=>{const item=e.target.closest('[data-open-version],[data-open-requirement],[data-page]');if(!item)return;if(item.dataset.openVersion)navigate('version',item.dataset.openVersion);else if(item.dataset.openRequirement)navigate('requirement',null,item.dataset.openRequirement);else navigate(item.dataset.page)});
document.getElementById('app').addEventListener('change',e=>{if(e.target.id==='year-filter')state.year=e.target.value;render()});
document.querySelectorAll('[data-step]').forEach(button=>button.onclick=()=>{const pages=['overview','version','requirement'],index=pages.indexOf(state.page);navigate(pages[Math.min(2,Math.max(0,index+Number(button.dataset.step)))])});
document.querySelectorAll('.side [data-page]').forEach(button=>button.onclick=()=>navigate(button.dataset.page));
addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const pages=['overview','version','requirement'],index=pages.indexOf(state.page);navigate(pages[Math.min(2,Math.max(0,index+(e.key==='ArrowRight'?1:-1)))])}});
addEventListener('popstate',()=>{const p=new URLSearchParams(location.search);state.page=['overview','version','requirement'].includes(p.get('page'))?p.get('page'):'overview';state.version=versions.some(v=>v.id===p.get('version')&&v.selected)?p.get('version'):'v24';state.requirement=p.get('requirement')||version().req[0].id;render()});
const p=new URLSearchParams(location.search);if(['overview','version','requirement'].includes(p.get('page')))state.page=p.get('page');if(versions.some(v=>v.id===p.get('version')&&v.selected))state.version=p.get('version');if(p.get('requirement'))state.requirement=p.get('requirement');render();
</script>
</body></html>
