:0;background:#fff;border:1px solid var(--line);border-radius:8px}.panel-head{display:flex;justify-content:space-between;gap:14px;align-items:start;padding:15px 18px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:15px}.legend{color:var(--muted);font-size:11px}.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:5px}.dev-key{background:var(--dev)}.tune-key{background:var(--tune)}.idle-key{background:var(--idle)}.unknown-key{background:#d9dfe9}.future-key{background:#fff;border:1px solid #ccd4e1}.summary{display:flex;gap:19px;flex-wrap:wrap;margin:11px 18px;color:#536079;font-size:12px}.summary b{color:var(--ink)}.scroll{overflow:auto}.year-sheet{min-width:1050px}.year-header,.year-row{display:grid;grid-template-columns:170px minmax(740px,1fr) 205px;align-items:center}.year-header{min-height:47px;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line)}.year-header>div{padding:0 12px}.month-names,.year-track{display:grid;grid-template-columns:repeat(12,minmax(0,1fr))}.month-names span{padding-bottom:6px;border-bottom:1px solid var(--line)}.year-row{min-height:70px;border-bottom:1px solid #edf0f4}.year-row:last-child{border:0}.person{padding:8px 12px;min-width:0}.person b,.person span{display:block}.year-track{height:26px;border:1px solid var(--line);border-radius:5px;overflow:hidden}.month-track{display:flex;min-width:0;border-right:1px solid #fff}.piece{min-width:1px;height:100%;border-right:1px solid #ffffff80}.piece.dev{background:#dc8580}.piece.tune{background:#8ca6d9}.piece.idle{background:#b9c2d0}.piece.unknown{background:repeating-linear-gradient(45deg,#dce2ea 0 5px,#f1f3f7 5px 10px)}.piece.future{background:#fff;border:0}.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:0 12px;text-align:right}.totals b,.totals span{display:block}.totals span{color:var(--muted);font-size:10px}.foot{padding:10px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.month-controls{display:flex;flex-wrap:wrap;gap:6px;padding:12px 18px;border-bottom:1px solid var(--line)}.month-button{min-width:62px;font-size:12px}.month-sheet{--day:34px;--label:176px;width:max-content;min-width:100%}.month-headrow,.month-row{display:flex}.month-name{position:sticky;left:0;z-index:3;flex:0 0 var(--label);width:var(--label);padding:9px 11px;border-right:1px solid var(--line);background:#fff}.month-headrow .month-name{display:grid;place-items:center;color:var(--muted);font-size:11px}.month-name b,.month-name span{display:block}.days{position:relative;flex:none}.weeks,.dates,.day-grid{display:flex}.weeks{height:30px;border-bottom:1px solid var(--line)}.weeks span{flex:none;padding-top:5px;text-align:center;border-right:1px solid var(--line);color:#77839c;font-size:11px}.dates{height:51px}.date{width:var(--day);flex:0 0 var(--day);border-right:1px solid #edf0f4;text-align:center;font-size:11px;color:#5b6880}.date small{display:block;color:#9ca8bd}.date.off{background:#f0f2f6}.date.special{background:#eeeafb}.date.now{border-left:2px solid #344e78}.month-row{min-height:61px;border-top:1px solid #edf0f4}.day-grid{height:61px;position:relative}.segment{position:absolute;z-index:2;top:10px;height:40px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 4px;border:1px solid;border-radius:5px;white-space:nowrap;overflow:hidden;font-size:11px}.segment.dev{color:#a63b36;background:#f8e9e8;border-color:#d88682}.segment.tune{color:#3964a5;background:#edf2fc;border-color:#84a4da}.segment.idle{color:#5b687d;background:#eff1f5;border-color:#aeb9c9}.segment.unknown{color:#697589;background:repeating-linear-gradient(45deg,#f0f2f6 0 6px,#e1e6ef 6px 12px);border-color:#c9d0dc}.segment span{overflow:hidden;text-overflow:ellipsis}.segment b{padding:1px 5px;border:1px solid currentColor;border-radius:99px;font-size:10px}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:850px){.shell{grid-template-columns:1fr}. <body>
<div class="shell"><aside class="side"><div class="brand"><span class="mark">V</span>版本协同中心</div><div class="nav-label">日常管理</div><button class="nav">行动中心</button><button class="nav">版本</button><button class="nav">需求</button><button class="nav">人员</button><button class="nav">异常与审计</button><div class="nav-label">分析</div><button class="nav active">人力参与度</button><button class="nav">历史查询</button></aside><div class="main"><header class="top"><div><h1>人力参与度看板</h1><div class="note">核心需求阶段与已完成工单 · 年度 / 月度</div></div><span class="demo">演示数据 · 截至 2026-10-14</span></header><main class="content"><div class="toolbar"><div class="tabs" role="tablist" aria-label="参与度视图"><button class="tab" type="button" role="tab" data-view="year">年度堆叠条</button><button class="tab" type="button" role="tab" data-view="month">月度甘特时间带</button></div><div class="filters"><label>年份 <select class="select" id="year"><option>2026</option><option>2025</option></select></label><label>职能 <select class="select" id="function"><option>全部职能</option><option>UI</option><option>美术</option><option>动效</option><option>数值</option><option>客户端</option><option>服务端</option><option>KGUI</option><option>后台</option><option>QA</option></select></label><label><input type="checkbox" id="include-all">显示全部人员</label></div></div><div id="content"></div></main></div></div>
<script>
const snapshot='2026-10-14';
const make=(id,name,fn,known,phases,done,extra={})=>({id,name,fn,known,phases:phases.map(([type,start,end])=>({type,start,end})),done:done.map((date,i)=>({id:`${id}-${i}`,date})),...extra});
const people=[
  make('chen','陈明','服务端','2025-12-01',[
    ['dev','2025-12-22','2026-01-12'],['tune','2026-01-13','2026-01-28'],['dev','2026-02-04','2026-03-12'],['tune','2026-03-13','2026-03-31'],['dev','2026-04-06','2026-05-20'],['tune','2026-05-21','2026-06-10'],['dev','2026-07-01','2026-08-25'],['tune','2026-08-26','2026-09-08'],['dev','2026-09-09','2026-11-10']
  ],['2025-12-29','2026-01-08','2026-01-20','2026-03-09','2026-04-28','2026-05-18','2026-06-02','2026-08-20','2026-09-04','2026-09-29','2026-10-08']),
  make('lin','林芮','客户端','2026-01-05',[
    ['dev','2026-01-12','2026-02-20'],['tune','2026-02-21','2026-03-10'],['dev','2026-03-20','2026-05-12'],['tune','2026-05-13','2026-06-03'],['dev','2026-06-10','2026-07-30'],['tune','2026-07-31','2026-08-14'],['dev','2026-08-24','2026-09-10'],['tune','2026-09-11','2026-09-21'],['dev','2026-09-28','2026-10-30']
  ],['2026-02-18','2026-03-02','2026-05-08','2026-05-28','2026-07-27','2026-08-06','2026-09-08','2026-09-17','2026-09-24','2026-10-08']),
  make('zhou','周亮','后台','2026-01-05',[
    ['dev','2026-01-08','2026-03-05'],['tune','2026-03-06','2026-03-25'],['dev','2026-04-02','2026-05-21'],['tune','2026-05-22','2026-06-12'],['dev','2026-06-19','2026-07-29'],['tune','2026-07-30','2026-08-20'],['dev','2026-08-25','2026-09-06'],['tune','2026-09-07','2026-09-15'],['dev','2026-09-16','2026-09-25'],['tune','2026-09-26','2026-10-10']
  ],['2026-03-02','2026-03-13','2026-05-18','2026-06-05','2026-08-17','2026-09-03','2026-09-12','2026-09-23','2026-10-08']),
  make('huang','黄悦','UI','2026-01-05',[
    ['dev','2026-01-09','2026-02-13'],['tune','2026-02-14','2026-03-01'],['dev','2026-03-02','2026-04-29'],['tune','2026-04-30','2026-05-14'],['dev','2026-05-20','2026-07-15'],['tune','2026-07-16','2026-08-11'],['dev','2026-08-18','2026-09-09'],['tune','2026-09-10','2026-09-17'],['dev','2026-09-18','2026-10-02']
  ],['2026-02-10','2026-04-17','2026-05-08','2026-07-10','2026-08-03','2026-09-03','2026-09-15','2026-09-30','2026-10-08']),
  make('zheng','郑一','动效','2026-01-05',[
    ['dev','2026-01-05','2026-01-24'],['tune','2026-01-25','2026-02-23'],['dev','2026-03-04','2026-04-12'],['tune','2026-04-13','2026-05-20'],['dev','2026-06-01','2026-06-18'],['tune','2026-06-19','2026-07-15'],['dev','2026-07-16','2026-08-13'],['tune','2026-08-14','2026-09-10'],['dev','2026-09-18','2026-09-29'],['tune','2026-09-30','2026-10-22']
  ],['2026-02-06','2026-03-25','2026-05-12','2026-06-17','2026-08-10','2026-08-28','2026-09-25','2026-10-09']),
  make('sun','孙宇','QA','2026-02-02',[
    ['dev','2026-02-02','2026-02-13'],['tune','2026-02-14','2026-04-16'],['dev','2026-04-17','2026-04-27'],['tune','2026-04-28','2026-06-27'],['dev','2026-06-28','2026-07-07'],['tune','2026-07-08','2026-09-15'],['dev','2026-09-16','2026-09-18'],['tune','2026-09-19','2026-10-31']
  ],['2026-02-10','2026-03-03','2026-03-26','2026-05-08','2026-05-28','2026-07-06','2026-08-06','2026-09-04','2026-09-14','2026-09-17','2026-09-25','2026-10-09']),
  make('qian','钱佳','数值','2026-01-05',[['dev','2026-01-05','2026-03-18'],['tune','2026-03-19','2026-04-11']],['2026-02-16','2026-03-17','2026-03-30'],{activeTo:'2026-06-30',reason:'已离职'})
];
const date=s=>new Date(`${s}T00:00:00Z`),iso=d=>d.toISOString().slice(0,10),pad=n=>String(n).padStart(2,'0'),add=(s,n)=>iso(new Date(date(s).getTime()+n*86400000));
function days(a,b){const out=[];for(let d=a;d<=b;d=add(d,1))out.push(d);return out}
const special=new Set(['2026-09-12','2026-10-10']),holiday=new Set(['2026-01-01','2026-10-01','2026-10-02','2026-10-05','2026-10-06','2026-10-07']);
function working(d){if(special.has(d))return true;if(holiday.has(d))return false;return ![0,6].includes(date(d).getUTCDay())}
function status(p,d){if(d>snapshot)return 'future';if(d<p.known||p.activeTo&&d>p.activeTo)return 'unknown';if(p.phases.some(x=>x.type==='dev'&&x.start<=d&&d<=x.end))return 'dev';if(p.phases.some(x=>x.type==='tune'&&x.start<=d&&d<=x.end))return 'tune';return 'idle'}
const names={dev:'开发',tune:'调优',idle:'空闲',unknown:'未知',future:'未来'};
function episodes(p){const result=[];for(const d of days('2025-01-01',snapshot)){const type=status(p,d),prev=result.at(-1);if(prev&&prev.type===type)prev.end=d;else result.push({type,start:d,end:d})}return result.map((e,i)=>({...e,id:`${p.id}-${i}`,count:p.done.filter(x=>e.start<=x.date&&x.date<=e.end).length,ongoing:e.end===snapshot}))}
const byPerson=new Map(people.map(p=>[p.id,episodes(p)]));
const state={view:'year',year:'2026',month:9,fn:'全部职能',all:false};
const visible=()=>people.filter(p=>(state.all||!p.reason)&&(state.fn==='全部职能'||p.fn===state.fn));
function runs(input,fn){const out=[];for(const d of input){const type=fn(d),last=out.at(-1);if(last&&last.type===type)last.count++;else out.push({type,count:1})}return out}
function legend(){return `<div class="legend"><span><i class="dev-key"></i>开发期</span><span><i class="tune-key"></i>调优期</span><span><i class="idle-key"></i>空闲期</span><span><i class="unknown-key"></i>未知</span><span><i class="future-key"></i>未发生</span></div>`}
function totals(p,year){const t={dev:0,tune:0,idle:0,unknown:0,future:0};for(const d of days(`${year}-01-01`,`${year}-12-31`)){if(working(d))t[status(p,d)]++}return t}
function annual(){const list=visible(),year=state.year,workingDays=days(`${year}-01-01`,`${year}-12-31`).filter(working).length;return `<div class="panel"><div class="panel-head"><div><h2>年度堆叠条 · ${year}</h2><div class="note">全年工作日 ${workingDays} 天</div>${year===snapshot.slice(0,4)?`<div class="note">当前已工作 ${days(`${year}-01-01`,snapshot).filter(working).length} 天</div>`:''}</div>${legend()}</div><div class="scroll"><div class="year-sheet"><div class="year-header"><div>人员 / 当前职能</div><div class="month-names">${Array.from({length:12},(_,i)=>`<span>${i+1}月</span>`).join('')}</div><div aria-hidden="true"></div></div>${list.map(p=>{const t=totals(p,year);return `<div class="year-row"><div class="person"><b>${p.name}</b><span class="note">${p.fn}${p.reason?` · ${p.reason}`:''}</span></div><div class="year-track">${Array.from({length:12},(_,i)=>{const m=pad(i+1),ds=days(`${year}-${m}-01`,iso(new Date(Date.UTC(Number(year),i+1,0)))).filter(working);return `<div class="month-track">${runs(ds,d=>status(p,d)).map(g=>`<span class="piece ${g.type}" style="flex:${g.count}" title="${p.name} · ${i+1}月 · ${names[g.type]} ${g.count} 个工作日"></span>`).join('')}</div>`}).join('')}</div><div class="totals"><div><b>${t.dev}</b><span>开发天</span></div><div><b>${t.tune}</b><span>调优天</span></div><div><b>${t.idle}</b><span>空闲天</span></div></div></div>`}).join('')||'<div class="empty">当前筛选范围暂无人员</div>'}</div></div><div class="foot">空闲只表示没有关联的核心需求在开发或调优；仍可处理其他工作单。未知与未来不计入空闲，年度页不展示工单数。</div></div>`}
function monthDays(){const y=Number(state.year),m=state.month;return days(`${y}-${pad(m)}-01`,iso(new Date(Date.UTC(y,m,0))))}
function monthSegments(p,ds){const first=ds[0],last=ds.at(-1),list=[];for(const ep of byPerson.get(p.id)){if(ep.end<first||ep.start>last)continue;const start=ep.start<first?first:ep.start,end=ep.end>last?last:ep.end;list.push({...ep,left:ds.indexOf(start),length:ds.indexOf(end)-ds.indexOf(start)+1})}if(last>snapshot){const start=first>snapshot?first:add(snapshot,1);if(start<=last)list.push({type:'future',left:ds.indexOf(start),length:ds.indexOf(last)-ds.indexOf(start)+1})}return list}
function weekLabels(ds){let start=0,index=1;const rows=[];for(let i=0;i<ds.length;i++){if(date(ds[i]).getUTCDay()===0||i===ds.length-1){const count=i-start+1,label=`W${index++}`,rangeText=count===1?ds[start].slice(5):`${ds[start].slice(5)}-${ds[i].slice(8)}`;rows.push(`<span style="width:${count*40}px" title="${label} · ${rangeText}">${label}${count<3?'':` · ${rangeText}`}</span>`);start=i+1}}return rows.join('')}
function monthly(){const list=visible(),ds=monthDays(),width=ds.length*40,markerIndex=ds.indexOf(snapshot);return `<div class="panel"><div class="panel-head"><div><h2>月度甘特时间带 · ${state.year}-${pad(state.month)}</h2><div class="note">阶段长度按日显示；括号数字属于整段阶段</div><div class="note">本月工作日 ${ds.filter(working).length} 天</div></div>${legend()}</div><div class="month-controls">${Array.from({length:12},(_,i)=>`<button type="button" class="month-button ${state.month===i+1?'active':''}" data-month="${i+1}" aria-pressed="${state.month===i+1}">${pad(i+1)}月</button>`).join('')}</div><div class="month-table-frame"><div class="month-sheet"><div class="month-headrow"><div class="month-name">人员 / 当前职能</div><div class="days" style="width:${width}px"><div class="weeks">${weekLabels(ds)}</div><div class="dates">${ds.map(d=>`<div class="date ${working(d)?'':'off'} ${special.has(d)?'special':''} ${d===snapshot?'now':''}">${d.slice(8)}<small>${['日','一','二','三','四','五','六'][date(d).getUTCDay()]}</small>${working(d)?'':'<small class="rest-mark">休</small>'}</div>`).join('')}</div></div></div>${list.map(p=>{const totals={dev:0,tune:0,idle:0};for(const d of ds){const type=status(p,d);if(working(d)&&type in totals)totals[type]++}return `<div class="month-row"><div class="month-name"><div class="month-identity"><b>${p.name}</b><span class="note" title="${p.fn}${p.reason?` · ${p.reason}`:''}">${p.fn}${p.reason?` · ${p.reason}`:''}</span></div><span class="note">开发 ${totals.dev}天 · 调优 ${totals.tune}天 · 空闲 ${totals.idle}天</span></div><div class="days" style="width:${width}px"><div class="day-grid">${ds.map(d=>`<div class="date ${working(d)?'':'off'} ${special.has(d)?'special':''} ${d===snapshot?'now':''}"></div>`).join('')}${monthSegments(p,ds).map(ep=>ep.type==='future'?'':`<div class="segment ${ep.type}" style="left:${ep.left*40+2}px;width:${ep.length*40-4}px" title="${p.name} · ${names[ep.type]}期 · ${ep.start} 至 ${ep.end} · ${ep.ongoing?'ING ':'共'}${ep.count}张"><span>${names[ep.type]} · ${ds.slice(ep.left,ep.left+ep.length).filter(working).length}天</span>${ep.type==='unknown'?'':`<b>${ep.ongoing?'ING ':'共'}${ep.count}张</b>`}</div>`).join('')}</div></div></div>`}).join('')||'<div class="empty">当前筛选范围暂无人员</div>'}${markerIndex>=0?`<div class="today-line" style="left:${224+(markerIndex+.5)*40}px" aria-hidden="true"></div>`:''}</div></div><div class="foot">同一阶段跨月时，各月片段显示相同的完整阶段工单数，不是月完成数，也不能跨月相加。阶段天数按本月工作日计算；进行中的阶段显示 ING N张，空闲段也可有其他已完成工单。</div></div>`}
function syncUrl(){const u=new URL(location.href);u.searchParams.set('view',state.view);u.searchParams.set('year',state.year);u.searchParams.set('month',String(state.month));if(state.fn==='全部职能')u.searchParams.delete('function');else u.searchParams.set('function',state.fn);history.replaceState(null,'',u)}
function render(){document.querySelectorAll('[data-view]').forEach(tab=>{const active=tab.dataset.view===state.view;tab.classList.toggle('active',active);tab.setAttribute('aria-selected',String(active))});document.getElementById('year').value=state.year;document.getElementById('function').value=state.fn;document.getElementById('include-all').checked=state.all;document.getElementById('content').innerHTML=state.view==='year'?annual():monthly();document.querySelectorAll('[data-month]').forEach(button=>button.onclick=()=>{state.month=Number(button.dataset.month);syncUrl();render()})}
const params=new URLSearchParams(location.search);if(['year','month'].includes(params.get('view')))state.view=params.get('view');if(['2025','2026'].includes(params.get('year')))state.year=params.get('year');if(Number(params.get('month'))>=1&&Number(params.get('month'))<=12)state.month=Number(params.get('month'));if([...document.getElementById('function').options].some(x=>x.value===params.get('function')))state.fn=params.get('function');
document.querySelectorAll('[data-view]').forEach(tab=>tab.onclick=()=>{state.view=tab.dataset.view;syncUrl();render()});document.getElementById('year').onchange=e=>{state.year=e.target.value;syncUrl();render()};document.getElementById('function').onchange=e=>{state.fn=e.target.value;syncUrl();render()};document.getElementById('include-all').onchange=e=>{state.all=e.target.checked;render()};window.addEventListener('popstate',()=>location.reload());render();
</script>
</body>
