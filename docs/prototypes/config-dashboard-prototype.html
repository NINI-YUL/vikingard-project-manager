<body>
  <!-- Three variants of the configuration library and management dashboard, switchable via ?variant=. PROTOTYPE: no persistence or production integration. -->
  <div class="ribbon">交互原型 · 演示数据</div><div id="app"></div>
  <script>
    const variants={A:"行动驾驶舱",B:"配置工作台",C:"对象探索器"};
    const state={page:"dashboard",config:"version",selected:"requirement",detailType:"requirement",actionTab:"delivery",selectedFunctions:[],selectedVersion:"全部活跃版本",currentVersion:"V1.8.0",versionRailCollapsed:false,specialWorkdays:[12]};
    state.calendarMonth="2026-09";
    state.calendarEditing=null;
    state.calendarOverrides={"2026-09-12":{type:"overtime",note:"集体加班 · 资料片冲刺"},"2026-09-13":{type:"holiday",note:"中秋假期"},"2026-09-14":{type:"holiday",note:"中秋假期"},"2026-09-15":{type:"holiday",note:"中秋假期"}};
    const metric=(label,value,note,tone="")=>`<div class="card"><div class="note">${label}</div><div class="metric ${tone}">${value}</div><div class="note" style="margin-top:7px">${note}</div></div>`;
    const risks=`<div class="risk high" data-drill="requirement"><span class="pill red">高风险</span> <span class="risk-name">公会跨服战</span><div class="risk-meta">服务端阻塞 3 个工作日 · 影响测试阶段完成 · V1.8.0</div></div><div class="risk" data-drill="workitem"><span class="pill amber">需关注</span> <span class="risk-name">商城重构 / 客户端</span><div class="risk-meta">计划进度 72%，反馈进度 45% · 距截止 2 个工作日</div></div><div class="risk" data-drill="person"><span class="pill purple">并发关注</span> <span class="risk-name">林舟</span><div class="risk-meta">4 个核心专业子单 · 其中 3 个计划区间重叠</div></div>`;
    function header(title,sub){return `<header class="top"><div><div class="title">${title}</div><div class="sub">${sub}</div></div><div class="toolbar"><select id="version-filter" class="select" onchange="updateVersionFilter(this)"><option>全部活跃版本</option><option>V1.8.0</option><option>V1.7.5</option></select><details id="function-filter" class="multi-filter"><summary id="function-summary">职能：全部 ▾</summary><div class="filter-menu"><label><input type="checkbox" aria-label="全部" value="全部" checked onchange="updateFunctionSummary(this)"> 全部</label><label><input type="checkbox" aria-label="UI" value="UI" onchange="updateFunctionSummary(this)"> UI</label><label><input type="checkbox" aria-label="美术" value="美术" onchange="updateFunctionSummary(this)"> 美术</label><label><input type="checkbox" aria-label="动效" value="动效" onchange="updateFunctionSummary(this)"> 动效</label><label><input type="checkbox" aria-label="数值" value="数值" onchange="updateFunctionSummary(this)"> 数值</label><label><input type="checkbox" aria-label="客户端" value="客户端" onchange="updateFunctionSummary(this)"> 客户端</label><label><input type="checkbox" aria-label="服务端" value="服务端" onchange="updateFunctionSummary(this)"> 服务端</label><label><input type="checkbox" aria-label="KGUI" value="KGUI" onchange="updateFunctionSummary(this)"> KGUI</label><label><input type="checkbox" aria-label="后台" value="后台" onchange="updateFunctionSummary(this)"> 后台</label></div></details><button class="primary" data-page="config">打开配置库</button></div></header>`}
    function updateFunctionSummary(changed){const boxes=[...document.querySelectorAll('.multi-filter input')],all=boxes.find(input=>input.value==='全部'),specific=boxes.filter(input=>input!==all);if(changed===all&&all.checked)specific.forEach(input=>input.checked=false);if(changed!==all&&changed.checked)all.checked=false;if(!specific.some(input=>input.checked))all.checked=true;state.selectedFunctions=specific.filter(input=>input.checked).map(input=>input.value);document.getElementById('function-summary').textContent=`职能：${all.checked?'全部':state.selectedFunctions.join('、')} ▾`;applyFilters()}
    function updateVersionFilter(select){state.selectedVersion=select.value;applyFilters()}
    function applyFilters(){
      const functions={"服务端联调":"服务端","客户端联调":"客户端","商城客户端重构":"客户端","商城 UI 适配":"UI"};
      const versionAll=state.selectedVersion==='全部活跃版本';
      const versionMatches=text=>versionAll||text.includes(state.selectedVersion);
      const functionMatches=row=>!state.selectedFunctions.length||state.selectedFunctions.includes(row.dataset.function||functions[row.cells?.[0]?.textContent.trim()]);
      let riskItems=0,highDemands=0,watchDemands=0;
      const ownerCounts={};
      document.querySelectorAll('#risk-section .risk').forEach(demand=>{
        const versionMatch=versionMatches(demand.querySelector('.risk-meta').textContent),rows=[...demand.querySelectorAll('tbody tr')];
        rows.forEach(row=>{row.hidden=!versionMatch||!functionMatches(row);if(!row.hidden){const owner=row.cells[1].textContent.trim();ownerCounts[owner]=(ownerCounts[owner]||0)+1}});
        const visible=rows.filter(row=>!row.hidden).length;
        demand.hidden=!visible;riskItems+=visible;
        if(visible&&demand.dataset.riskLevel==='high')highDemands++;
        if(visible&&demand.dataset.riskLevel==='watch')watchDemands++;
      });
      const filterDelivery=id=>{
        let count=0;const owners={};
        document.querySelectorAll(`#${id} [data-delivery-group]`).forEach(group=>{
          const versionMatch=versionMatches(group.dataset.version||group.textContent),rows=[...group.querySelectorAll('[data-workitem]')];
          rows.forEach(row=>{row.hidden=!versionMatch||!functionMatches(row);if(!row.hidden){count++;const owner=row.dataset.owner;owners[owner]=(owners[owner]||0)+1}});
          const visible=rows.filter(row=>!row.hidden).length;
          group.hidden=!visible;
          const groupCount=group.querySelector('[data-group-count]');if(groupCount)groupCount.textContent=`${visible} 张`;
        });
        return {count,owners};
      };
      const filterData=id=>{let count=0,groups=0,header=null,rows=[];const flush=()=>{if(!header)return;rows.forEach(row=>{const scope=row.dataset.version||row.cells[1]?.textContent||'';row.hidden=!versionMatches(scope)});const visibleRows=rows.filter(row=>!row.hidden),visible=visibleRows.length,itemCount=visibleRows.reduce((sum,row)=>sum+Number(row.dataset.count||1),0);header.hidden=!visible;const note=header.querySelector('.note');if(note)note.textContent=note.textContent.replace(/\d+ 项/,`${itemCount} 项`);count+=itemCount;if(visible)groups++};document.querySelectorAll(`#${id} tbody tr`).forEach(row=>{if(row.cells.length===1&&row.cells[0].colSpan>1){flush();header=row;rows=[]}else rows.push(row)});flush();return {count,groups}};
      const overdue=filterDelivery('overdue-section'),due=filterDelivery('due-section'),errors=filterData('data-errors'),confirmations=filterData('confirmations');
      document.getElementById('top-version-count').textContent=versionAll?'2 个活跃版本':state.selectedVersion;
      document.getElementById('top-high-demands').textContent=highDemands;
      document.getElementById('top-watch-demands').textContent=watchDemands;
      document.getElementById('top-risk-items').textContent=riskItems;
      document.getElementById('top-overdue').textContent=overdue.count;
      document.getElementById('top-due').textContent=due.count;
      document.getElementById('risk-section-count').textContent=`${highDemands+watchDemands} 个需求 · ${riskItems} 张工单`;
      document.getElementById('overdue-section-count').textContent=`${overdue.count} 张工单`;
      document.getElementById('due-section-count').textContent=`${due.count} 张工单`;
      document.querySelectorAll('[data-risk-owner]').forEach(card=>{const owner=card.dataset.riskOwner,count=ownerCounts[owner]||0;card.hidden=!count;card.querySelector('[data-owner-risk]').textContent=`${count} 风险`;card.querySelector('[data-owner-overdue]').textContent=`${overdue.owners[owner]||0} 逾期`;card.querySelector('[data-owner-due]').textContent=`${due.owners[owner]||0} 三日内`});
      document.getElementById('owner-empty').hidden=Object.keys(ownerCounts).length>0;
      document.getElementById('data-error-count').textContent=`${errors.groups} 类 · ${errors.count} 项`;
      document.getElementById('confirmation-count').textContent=`${confirmations.groups} 类 · ${confirmations.count} 项`;
    }
    const applyFiltersWithoutCoverage=applyFilters;
    applyFilters=()=>{applyFiltersWithoutCoverage();const coverage=state.selectedVersion==='V1.7.5'?'94%':'76%';document.getElementById('data-error-count').textContent+=` · 数据覆盖率 ${coverage}`}
    function setActionTab(tab){state.actionTab=tab;document.getElementById('delivery-tab').hidden=tab!=='delivery';document.getElementById('data-tab').hidden=tab!=='data';document.getElementById('function-filter').hidden=tab==='data';document.querySelectorAll('.action-tab').forEach(button=>button.classList.toggle('active',button.dataset.actionTab===tab))}
    function dashboardV2(){return `${header("首页行动清单","全部活跃版本 · 两个页签分别处理交付事项与数据事项")}<main class="content">
      <div class="action-tabs"><button class="action-tab active" data-action-tab="delivery" onclick="setActionTab('delivery')">风险与到期</button><button class="action-tab" data-action-tab="data" onclick="setActionTab('data')">数据待处理</button></div>
      <div id="delivery-tab">
      <div class="action-scope"><span><b>当前范围：</b><span id="top-version-count">2 个活跃版本</span></span><span>仅统计核心需求下的核心专业子单</span></div>
      <div class="grid action-metrics">
        <div class="card action-metric high"><div class="note">高风险需求</div><div id="top-high-demands" class="metric red">1</div><div class="note" style="margin-top:7px">范围内最高风险为高风险</div><div class="metric-base"><i></i><i></i><i></i><i></i><i></i></div></div>
        <div class="card action-metric watch"><div class="note">需关注需求</div><div id="top-watch-demands" class="metric amber">1</div><div class="note" style="margin-top:7px">尚未升级为高风险</div><div class="metric-base"><i></i><i></i><i></i><i></i><i></i></div></div>
        <div class="card action-metric risk-item"><div class="note">风险工单</div><div id="top-risk-items" class="metric red">4</div><div class="note" style="margin-top:7px">高风险与需关注核心专业子单</div><div class="metric-base"><i></i><i></i><i></i><i></i><i></i></div></div>
        <div class="card action-metric overdue"><div class="note">已逾期工单</div><div id="top-overdue" class="metric red">3</div><div class="note" style="margin-top:7px">截止时间已过且未终态</div><div class="metric-base"><i></i><i></i><i></i><i></i><i></i></div></div>
        <div class="card action-metric due"><div class="note">三日内到期</div><div id="top-due" class="metric blue">6</div><div class="note" style="margin-top:7px">未来 3 个公司工作日</div><div class="metric-base"><i></i><i></i><i></i><i></i><i></i></div></div>
      </div>
      <div class="action-columns"><div class="action-primary">
      <section id="risk-section" class="card"><div class="section-head"><div><div class="section-title">1　风险关注</div><div class="note">按高风险、需关注、正常形成视觉层级；当前只展开存在风险核心专业子单的需求</div><div style="margin-top:7px"><span class="pill red">高风险</span> <span class="pill amber">需关注</span> <span class="pill green">正常 · 不展开</span></div></div><span id="risk-section-count" class="pill red">2 个需求 · 4 张工单</span></div>
        <div class="risk high" data-risk-level="high" data-drill="requirement"><div class="section-head"><div><span class="pill red">高风险</span> <b style="font-size:16px">公会跨服战</b><div class="risk-meta">V1.8.0 · 需求负责人：陈策 · 预计完成：09-16 · 影响测试阶段完成</div></div></div>
          <table><thead><tr><th>风险工单</th><th>执行者</th><th>状态</th><th>进度</th><th>截止时间</th><th>风险原因 / 所需协助</th></tr></thead><tbody><tr data-drill="workitem"><td>服务端联调</td><td>周岚</td><td><span class="pill red">阻塞</span></td><td>80%</td><td>09-11</td><td>缺测试环境；需要运维今日开通</td></tr><tr data-drill="workitem"><td>客户端联调</td><td>林舟</td><td>开发中</td><td><span class="pill amber">45%</span></td><td>09-12</td><td>等待服务端接口；需要确认联调窗口</td></tr></tbody></table>
        </div>
        <div class="risk" data-risk-level="watch" data-drill="requirement" style="margin-top:10px"><div class="section-head"><div><span class="pill amber">需关注</span> <b style="font-size:16px">商城重构</b><div class="risk-meta">V1.8.0 · 需求负责人：许宁 · 预计完成：09-14 · 影响基础流程完成</div></div></div>
          <table><thead><tr><th>风险工单</th><th>执行者</th><th>状态</th><th>进度</th><th>截止时间</th><th>风险原因 / 所需协助</th></tr></thead><tbody><tr data-drill="workitem"><td>商城客户端重构</td><td>林舟</td><td>开发中</td><td><span class="pill amber">45%</span></td><td>09-12</td><td>计划应达 72%；需要确认剩余工作量</td></tr><tr data-drill="workitem"><td>商城 UI 适配</td><td>秦悦</td><td>开发中</td><td><span class="pill amber">待反馈</span></td><td>09-13</td><td>本轮尚无有效反馈；需要执行者更新</td></tr></tbody></table>
        </div>
      </section>
      <section id="overdue-section" class="card"><div class="section-head"><div><div class="section-title">2　已逾期工单</div><div class="note">按需求聚合、按逾期工作日着色；下方仍完整列出核心专业子单</div></div><span id="overdue-section-count" class="pill red">3 张工单</span></div>
        <div class="overdue-legend"><span><i class="legend-square" style="background:#8f2528"></i>阻塞</span><span><i class="legend-square" style="background:#b5363a"></i>开发中</span><span><i class="legend-square" style="background:#efede8"></i>未占用区间</span></div>
        <div class="overdue-group delivery-group" data-delivery-group data-version="V1.8.0"><div class="overdue-demand"><b>公会跨服战</b><span class="note">V1.8.0 · <span data-group-count>1 张</span></span></div><div class="overdue-track"><div class="overdue-fill blocked" style="width:64%">3日 · 阻塞</div></div><div class="overdue-items"><div class="overdue-item" data-workitem data-function="服务端" data-owner="周岚" data-drill="workitem"><b>战斗结算服务端</b><span>周岚</span><span class="red">逾期 3 日</span><span>等待测试环境</span></div></div></div>
        <div class="overdue-group delivery-group" data-delivery-group data-version="V1.8.0"><div class="overdue-demand"><b>商城重构</b><span class="note">V1.8.0 · <span data-group-count>1 张</span></span></div><div class="overdue-track"><div class="overdue-fill working" style="width:24%">1日</div></div><div class="overdue-items"><div class="overdue-item" data-workitem data-function="客户端" data-owner="林舟" data-drill="workitem"><b>商城埋点补充</b><span>林舟</span><span class="red">逾期 1 日</span><span>进行中 · 预计今天提交</span></div></div></div>
        <div class="overdue-group delivery-group" data-delivery-group data-version="V1.7.5"><div class="overdue-demand"><b>周年活动</b><span class="note">V1.7.5 · <span data-group-count>1 张</span></span></div><div class="overdue-track"><div class="overdue-fill working" style="width:42%">2日 · 开发中</div></div><div class="overdue-items"><div class="overdue-item" data-workitem data-function="动效" data-owner="郑一" data-drill="workitem"><b>活动入口动效</b><span>郑一</span><span class="red">逾期 2 日</span><span>资源昨日到齐</span></div></div></div>
      </section>
      </div><div class="action-secondary">
      <section id="due-section" class="card"><div class="section-head"><div><div class="section-title">3　即将到期工单</div><div class="note">按截止日期形成时间轴；所属需求保留在工单卡片中</div></div><span id="due-section-count" class="pill amber">6 张工单</span></div><div class="due-timeline">

    function requirementTimelineV2(){
      const dayNumbers=Array.from({length:16},(_,i)=>i+1);
      const specialWorkday=n=>state.specialWorkdays.includes(n);
      const nonworking=n=>[0,6].includes(new Date(2026,8,n).getDay())&&!specialWorkday(n);
      const weekday=n=>['日','一','二','三','四','五','六'][new Date(2026,8,n).getDay()];
      const workdays=(start,end)=>dayNumbers.filter(n=>n>=start&&n<=end&&!nonworking(n)).length;

        const match=x.range.match(/^09-(\d\d) → 09-(\d\d)$/);

        const bar=match?`<div class="gantt-v2-bar ${x.tone}" style="left:${(Number(match[1])-1)/16*100}%;width:${(Number(match[2])-Number(match[1])+1)/16*100}%">${x.label}</div>`:'<div class="gantt-v2-unplanned">周期未配置 · 不绘制时间条</div>';
        return `<div class="gantt-v2-row" role="button" tabindex="0" data-req-drawer="${index}" aria-label="查看${x.fn}工作单${x.name}详情"><div class="gantt-v2-label"><div><b>${x.fn}</b>${x.name}</div><small>${label}</small></div><div class="gantt-v2-track">${cells}${bar}</div></div>`;

      return `<div class="rules-dialog-head"><div><h2 id="rules-dialog-title">${restore?"恢复继承":"编辑规则配置"}</h2><p>${cfgSafe(rulesTitle(e.ctx))} · 仅当前会话演示</p></div><button class="ghost" type="button" data-rules-cancel>关闭</button></div><form data-rules-form novalidate><div class="rules-dialog-body"><div class="rules-impact">影响范围：${system?"系统默认及未覆盖对应配置项的版本、需求；开发关注阈值适用于全部活跃版本。":e.ctx.scope==="version"?"当前版本及未覆盖对应配置项的下属需求；不影响其他版本。":"仅当前需求；不修改版本或系统默认。"}变更只影响后续判断和采集，不改写已留档历史、补发旧通知或认定实际上线。</div>${restore?`<section class="rules-dialog-section"><h3>确认移除当前对象的特殊配置</h3><p>恢复后使用上层最新配置；原操作记录保留。</p>${["foundation","detail","schedules"].map(f=>`<p><b>${rulesLabels[f]}</b>：${cfgSafe(rulesFormat(f,parent[f].value))} · ${parent[f].source}</p>`).join("")}</section>`:`<section class="rules-dialog-section"><h3>进度判断配置</h3>${choices("foundation","detail")}${choices("detail","foundation")}<div class="rules-editor-field"><div class="rules-field-head"><b>测试阶段</b><span class="rules-source">固定规则 · 只读</span></div><p>核心专业子单、测试总单及其缺陷、验收总单及其子任务、辅助子单及其他应处理后代工单全部满足终态规则。非交付终态单列，缺失或未知不视为完成；完成不等于实际上线。</p></div></section><section class="rules-dialog-section"><h3>进度采集与风险配置</h3><div class="rules-editor-field">${fieldHead("schedules")}<div data-rules-times>${rulesTimeRows()}</div><button class="ghost rules-add-time" type="button" data-rules-add-time>＋ 添加时间点</button><p>北京时间；仅在公司工作日且命中所选星期和时间时触发。采集未进入终态、有执行者且身份映射已确认的核心专业子单；缺少执行者或映射时进入异常处理。</p><p data-rules-source="schedules">${e.reset.includes("schedules")?"保存后恢复继承":`当前来源：${e.initial.schedules.source}`}</p></div><div class="rules-editor-field"><div class="rules-field-head"><b>开发关注阈值</b><span class="rules-source">全活跃版本统一</span></div>${system?`<label>重叠达到 <input class="select" type="number" min="1" step="1" value="${e.values.threshold}" data-rules-threshold aria-label="开发关注阈值"> 张时提示</label>`:`<p><b>${state.rules.system.threshold} 张</b> · 继承系统默认，仅系统默认层级可修改。</p>`}<p>按同一执行者的计划区间重叠数量判断，只提示管理者复核。</p></div></section>`}<label class="rules-reason" for="rules-reason">变更原因（必填）</label><textarea class="select" id="rules-reason" maxlength="500" placeholder="说明本次调整的原因" data-rules-reason aria-describedby="rules-error">${cfgSafe(e.reason)}</textarea><p class="rules-error" id="rules-error" role="alert" tabindex="-1" ${e.error?"":"hidden"}>${cfgSafe(e.error)}</p>${e.confirmDiscard?'<p class="rules-error" role="status">有未保存修改。继续编辑，或点击“放弃修改并关闭”。</p>':""}</div><div class="rules-dialog-actions">${!system&&!restore&&Object.keys(rulesOwn(e.ctx)).length?'<button class="ghost rules-restore" type="button" data-rules-restore>恢复继承</button>':'<span class="note">保存后更新当前配置</span>'}<div>${e.confirmDiscard?'<button class="ghost" type="button" data-rules-discard>放弃修改并关闭</button>':''}<button class="ghost" type="button" data-rules-cancel>取消</button><button class="primary" type="submit">${restore?"确认恢复继承":"保存配置"}</button></div></div></form>`;
    }
    function rulesDialog(){return state.rules.editor?`<dialog class="rules-dialog" id="rules-dialog" aria-labelledby="rules-dialog-title">${rulesDialogContent()}</dialog>`:""}
    function bindRules(){
      document.querySelectorAll("[data-rules-scope]").forEach(b=>b.onclick=()=>{state.cfg.scope=b.dataset.rulesScope;state.rules.feedback="";render()});
      document.querySelector("[data-rules-version]")?.addEventListener("change",e=>{state.cfg.version=e.target.value;rulesEnsureSelection();state.rules.feedback="";render()});
      document.querySelector("[data-rules-requirement]")?.addEventListener("change",e=>{state.cfg.requirement=e.target.value;state.rules.feedback="";render()});
      document.querySelector("[data-rules-edit]")?.addEventListener("click",()=>{rulesOpenEditor();render()});
      document.querySelector("[data-rules-view-parent]")?.addEventListener("click",()=>{state.cfg.scope=state.cfg.scope==="requirement"?"version":"system";render()});
      const dialog=document.getElementById("rules-dialog");if(!dialog)return;
      const e=state.rules.editor;
      const redraw=()=>{dialog.innerHTML=rulesDialogContent();bindRulesDialog()};
      const close=()=>{state.rules.editor=null;dialog.close();render();document.querySelector("[data-rules-edit]")?.focus()};
      const cancel=()=>{if(rulesChanged(e)||e.reason.trim()){e.confirmDiscard=true;redraw();dialog.querySelector("[data-rules-discard]")?.focus()}else close()};
      dialog.oncancel=event=>{event.preventDefault();cancel()};
      function bindRulesDialog(){
        dialog.querySelectorAll("[data-rules-cancel]").forEach(b=>b.onclick=cancel);
        dialog.querySelector("[data-rules-discard]")?.addEventListener("click",close);
        dialog.querySelector("[data-rules-reason]").oninput=event=>e.reason=event.target.value;
        dialog.querySelector("[data-rules-threshold]")?.addEventListener("input",event=>e.values.threshold=Number(event.target.value));
        dialog.querySelectorAll("[data-rules-function]").forEach(input=>input.onchange=()=>{
          const f=input.dataset.rulesFunction;e.values[f]=[...dialog.querySelectorAll(`[data-rules-function="${f}"]:checked`)].map(x=>x.value);e.reset=e.reset.filter(x=>x!==f);e.confirmDiscard=false;
          const other=f==="foundation"?"detail":"foundation";dialog.querySelectorAll(`[data-rules-function="${other}"]`).forEach(x=>x.disabled=e.values[f].includes(x.value)&&!x.checked);
          dialog.querySelector(`[data-rules-source="${f}"]`).textContent="本次修改，保存后按项更新";
        });
        dialog.querySelectorAll("[data-rules-inherit]").forEach(b=>b.onclick=()=>{const f=b.dataset.rulesInherit;e.values[f]=rulesClone(rulesParent(e.ctx)[f].value);if(!e.reset.includes(f))e.reset.push(f);redraw()});
        const bindTimes=()=>{
          dialog.querySelectorAll("[data-rules-day]").forEach(x=>x.onchange=()=>{e.values.schedules[Number(x.dataset.rulesDay)].day=Number(x.value);e.reset=e.reset.filter(f=>f!=="schedules")});
          dialog.querySelectorAll("[data-rules-time]").forEach(x=>x.oninput=()=>{e.values.schedules[Number(x.dataset.rulesTime)].time=x.value;e.reset=e.reset.filter(f=>f!=="schedules")});
          dialog.querySelectorAll("[data-rules-remove-time]").forEach(x=>x.onclick=()=>{e.values.schedules.splice(Number(x.dataset.rulesRemoveTime),1);e.reset=e.reset.filter(f=>f!=="schedules");dialog.querySelector("[data-rules-times]").innerHTML=rulesTimeRows();bindTimes();dialog.querySelector("[data-rules-add-time]").focus()});
        };bindTimes();
        dialog.querySelector("[data-rules-add-time]")?.addEventListener("click",()=>{e.values.schedules.push({day:1,time:"10:00"});e.reset=e.reset.filter(f=>f!=="schedules");dialog.querySelector("[data-rules-times]").innerHTML=rulesTimeRows();bindTimes();dialog.querySelectorAll("[data-rules-day]")[e.values.schedules.length-1].focus()});
        dialog.querySelector("[data-rules-restore]")?.addEventListener("click",()=>{e.mode="restore";e.confirmDiscard=false;e.error="";redraw();dialog.querySelector("[data-rules-reason]").focus()});
        dialog.querySelector("form").onsubmit=event=>{event.preventDefault();if(!rulesChanged(e)){e.error="尚未修改配置；可以取消关闭。"}else if(rulesSave()){dialog.close();render();document.querySelector("[data-rules-edit]")?.focus();return}redraw();dialog.querySelector("#rules-error").focus()};
      }
      bindRulesDialog();
    }
    // End rules settings.
    function cfgCalendar(){return calendarWorkspace()}
    function cfgNotices(){return `${cfgBox("通知节点与接收规则",`<table class="cfg-table-notices"><thead><tr><th>通知节点</th><th>接收规则</th></tr></thead><tbody><tr><td>基础流程完成</td><td>核心需求参与者中的测试、运营、策划、PM</td></tr><tr><td>细节完整完成</td><td>参与者中的测试、运营、策划、PM 角色</td></tr><tr><td>优化需求完成</td><td>相关策划角色</td></tr></tbody></table><div class="cfg-section-body note">实际投递还需满足通知节点触发、需求关系和身份映射已确认。系统权限不增加通知资格；无法投递的人员不会被自动替换。具体接收人应在对应需求范围核对，本页不按单个人员模拟或推算收件人数。</div>`)}`}
    function statusMappingDialog(){const e=state.statusMapping.editor;if(!e)return "";const rows=e.values.map((item,index)=>`<div class="status-editor-row"><div><b>${cfgSafe(item.name)}</b><small>${cfgSafe(item.id)}</small></div><label>统一管理语义<select data-status-semantic="${index}" aria-label="${cfgSafe(item.name)} 的统一管理语义"><option value="">请选择</option>${statusSemanticOptions.map(value=>`<option value="${cfgSafe(value)}" ${item.semantic===value?"selected":""}>${value}</option>`).join("")}</select></label><div><span class="note">计时节点</span><div class="status-checks"><label class="status-check"><input type="checkbox" data-status-timing="${index}" value="开发计时开始" ${item.timing.includes("开发计时开始")?"checked":""}>开发开始</label><label class="status-check"><input type="checkbox" data-status-timing="${index}" value="开发计时结束" ${item.timing.includes("开发计时结束")?"checked":""}>开发结束</label><label class="status-check"><input type="checkbox" data-status-timing="${index}" value="测试计时开始" ${item.timing.includes("测试计时开始")?"checked":""}>测试开始</label><label class="status-check"><input type="checkbox" data-status-timing="${index}" value="测试计时结束" ${item.timing.includes("测试计时结束")?"checked":""}>测试结束</label></div></div><span class="status-source">${item.semantic?"保存后待验证恢复":"新增状态需先完成映射"}</span></div>`).join("");return `<dialog class="status-dialog" id="status-dialog" aria-labelledby="status-dialog-title"><div class="status-dialog-head"><div><h2 id="status-dialog-title">编辑状态映射</h2><p>${cfgSafe(state.statusMapping.project)} · ${cfgSafe(state.statusMapping.workflow)} · 统一维护全部原始状态</p></div><button type="button" class="ghost" data-status-cancel>关闭</button></div><form data-status-form><div class="status-dialog-body"><div class="status-impact">影响范围：完成判断、开发/测试历时、风险和通知。保存后进入“待验证恢复”，相关异常不会直接关闭；原始状态 ID、名称和历史保留。</div>${rows}<label class="status-reason" for="status-reason">变更原因（必填）</label><textarea class="select" id="status-reason" data-status-reason maxlength="500" placeholder="说明本次状态语义或计时节点调整"></textarea><p class="status-error" role="alert" data-status-error hidden></p></div><div class="status-dialog-actions"><button type="button" class="ghost" data-status-cancel>取消</button><button type="submit" class="primary">保存映射</button></div></form></dialog>`}
    function statusMappingPage(){const s=state.statusMapping,mapped=s.mappings.filter(x=>x.semantic).length,unmapped=s.mappings.length-mapped,verified=statusRecoveryLabel();return `${cfgBox("状态语义映射",`<div class="status-panel"><div class="status-panel-head"><div><h2>原始状态 → 统一管理语义</h2><p>保留 Teambition 原始状态，用统一语义驱动完成判断、历时和风险通知。</p></div><button class="primary" type="button" data-status-edit>编辑映射</button></div><div class="status-summary"><span class="tag"><strong>${s.mappings.length}</strong> 个原始状态</span><span class="tag green"><strong>${mapped}</strong> 个已映射</span><span class="tag ${unmapped?"amber":"green"}"><strong>${unmapped}</strong> 个待映射</span><span class="tag ${s.recovery.phase==="restored"?"green":"amber"}">${verified}</span></div></div><table class="status-table"><thead><tr><th>Teambition 原始状态</th><th>状态 ID</th><th>统一管理语义</th><th>计时节点</th><th>映射结果</th></tr></thead><tbody>${s.mappings.map(item=>`<tr class="${item.semantic?"":s.feedback?"status-pending":"status-unmapped"}"><td><b>${cfgSafe(item.name)}</b></td><td class="cfg-mono">${cfgSafe(item.id)}</td><td>${item.semantic?`<span class="tag">${cfgSafe(item.semantic)}</span>`:'<span class="note">未映射</span>'}</td><td><div class="status-timing">${item.timing.map(t=>`<span class="tag">${cfgSafe(t)}</span>`).join("")||'<span class="note">无计时节点</span>'}</div></td><td><span class="pill ${!item.semantic||["pending","failed"].includes(s.recovery.phase)?"amber":"green"}">${!item.semantic?"待映射":s.recovery.phase==="restored"?"已恢复（模拟）":s.recovery.phase==="failed"?"验证失败":s.recovery.phase==="pending"?"待验证恢复":"已映射"}</span></td></tr>`).join("")}</tbody></table><div class="cfg-section-body note">未映射状态继续同步，但暂停受影响的完成判断、开发/测试历时、风险和通知；恢复需等待相关数据重新同步、计算或校验确认。</div>`,`<div class="status-empty">${s.audit.length?`本次会话：${cfgSafe(s.audit[0])}`:"状态 ID、原始名称与历史不会被覆盖"}</div>`)}`}
    function cfgMapping(){return statusMappingPage()+statusMappingDialog()}
    const systemPermissions={none:{label:"无后台访问权限",note:"不能进入配置库或执行管理操作。",tone:""},viewer:{label:"查看者",note:"可查看管理看板、版本和历史，不可修改配置。",tone:""},admin:{label:"系统管理员",note:"可维护配置、处理异常、启用或结束版本。",tone:"admin"},owner:{label:"系统所有者",note:"可管理系统权限，并拥有系统管理员全部权限。",tone:"owner"}};
    function systemPermissionOf(person){return person.systemPermission||"none"}
    function peopleDialog(){
      const person=rolePeople.find(item=>item.name===state.rolePerson);
      if(!person||!state.personModal)return "";
      const ownerCount=rolePeople.filter(item=>item.mapping==="confirmed"&&systemPermissionOf(item)==="owner").length;
      const lastOwner=person.mapping==="confirmed"&&systemPermissionOf(person)==="owner"&&ownerCount===1;
      const identity=`<strong>${cfgSafe(person.name)}</strong><span>${cfgSafe(person.tbName)} · ${cfgSafe(person.id)}</span>`;
      if(state.personModal==="delete")return `<dialog class="person-dialog" id="person-dialog" aria-labelledby="person-dialog-title"><div class="person-dialog-head"><div><h2 id="person-dialog-title">删除人员配置</h2><p class="note">${identity}</p></div><button class="ghost" type="button" data-person-modal-close>关闭</button></div><form data-system-delete-form><div class="person-dialog-body"><p class="person-delete-copy">将移除该人员在本系统的身份映射、业务角色和系统权限，停止后续通知投递。Teambition、钉钉账号及已同步工作事实不会删除；操作记录保留。</p></div><div class="person-dialog-actions"><button class="ghost" type="button" data-person-modal-close>取消</button><button class="primary danger" type="submit">确认删除配置</button></div></form></dialog>`;
      const mapped=person.mapping==="confirmed";
      const mappingOptions=`<option value="confirmed" ${mapped?"selected":""} ${person.mapping==="unmatched"?"disabled":""}>已映射</option><option value="pending" ${person.mapping==="pending"?"selected":""} ${lastOwner?"disabled":""}>未映射 · 待确认</option><option value="unmatched" ${person.mapping==="unmatched"?"selected":""} ${lastOwner?"disabled":""}>未映射 · 待人工核对</option>`;
      const roles=["测试","运营","策划","PM"].map(role=>`<label class="person-role-option"><input type="checkbox" name="businessRole" value="${role}" ${person.roles.includes(role)?"checked":""} ${mapped?"":"disabled"}><span>${role}</span></label>`).join("");
      const permissions=Object.entries(systemPermissions).map(([value,item])=>`<label class="person-permission-option"><input type="radio" name="systemPermission" value="${value}" ${systemPermissionOf(person)===value?"checked":""} ${!mapped||lastOwner&&value!=="owner"?"disabled":""}><span><b>${item.label}</b><small>${item.note}</small></span></label>`).join("");
      return `<dialog class="person-dialog" id="person-dialog" aria-labelledby="person-dialog-title"><div class="person-dialog-head"><div><h2 id="person-dialog-title">编辑人员配置</h2><p class="note">${identity}</p></div><button class="ghost" type="button" data-person-modal-close>关闭</button></div><form data-system-permission-form novalidate><div class="person-dialog-body"><section class="person-form-section"><h3>钉钉身份</h3><div class="person-identity"><div><span class="note">钉钉候选</span><b>${cfgSafe(person.candidate)}</b></div><div><span class="note">匹配依据</span><b>${cfgSafe(person.evidence)}</b></div></div><label for="person-mapping">映射状态</label><select class="select" id="person-mapping" name="mapping" data-person-mapping aria-describedby="person-mapping-error">${mappingOptions}</select>${person.mapping==="unmatched"?'<p class="person-hint">仅姓名近似，须先人工核对正确的钉钉人员；本演示不能直接确认映射。</p>':""}${lastOwner?'<p class="person-hint">请先指定另一名系统所有者，再解除此人的映射或权限。</p>':""}<label class="person-review" data-person-review ${!mapped&&person.mapping!=="unmatched"?"":"hidden"}><input type="checkbox" name="mappingReviewed"> 已人工核对候选人与 Teambition 人员为同一人（演示确认）</label><p class="person-error" id="person-mapping-error" role="alert" hidden></p></section><section class="person-form-section"><h3>业务角色 <small>只用于后续通知条件</small></h3><div class="person-role-options" role="group" aria-label="业务角色">${roles}</div></section><section class="person-form-section"><h3>系统权限 <small>与业务角色独立</small></h3><div class="person-permission-options" role="radiogroup" aria-label="系统权限">${permissions}</div></section><div class="person-unmapped" data-person-unmapped ${mapped?"hidden":""}>未映射人员不能保留业务角色或系统权限；保存后将撤销这些配置及后续通知资格。</div><label class="person-reason" for="person-reason">变更原因 <span>变更时必填</span></label><textarea class="select" id="person-reason" name="reason" rows="2" maxlength="120" placeholder="说明本次身份、角色或权限调整" aria-describedby="person-reason-error"></textarea><p class="person-error" id="person-reason-error" role="alert" hidden></p></div><div class="person-dialog-actions"><button class="ghost" type="button" data-person-modal-close>取消</button><button class="primary" type="submit" disabled>保存配置</button></div></form></dialog>`;
    }
    function cfgPeople(){
      const rows=rolePeople.map(person=>{
        const permission=systemPermissions[systemPermissionOf(person)];
        const lastOwner=person.mapping==="confirmed"&&systemPermissionOf(person)==="owner"&&rolePeople.filter(item=>item.mapping==="confirmed"&&systemPermissionOf(item)==="owner").length===1;
        const name=cfgSafe(person.name);
        return `<tr data-people-row data-search="${cfgSafe(`${person.name} ${person.tbName} ${person.id} ${person.candidate}`.toLowerCase())}" data-mapping="${person.mapping}" data-permission="${systemPermissionOf(person)}"><td><b>${name}</b><span class="person-cell-note">${cfgSafe(person.tbName)} · ${cfgSafe(person.id)}</span></td><td><span class="person-map ${person.mapping==="confirmed"?"":"attention"}">${person.mapping==="confirmed"?"已映射":"未映射"}</span><span class="person-cell-note">${cfgSafe(person.candidate)}</span></td><td>${person.roles.length?cfgSafe(person.roles.join("、")):'<span class="note">未设置</span>'}</td><td><span class="person-access ${permission.tone}">${permission.label}</span></td><td class="person-actions"><button type="button" data-person-edit="${name}" aria-label="编辑 ${name}">编辑</button><button type="button" class="danger" data-system-delete="${name}" aria-label="删除 ${name} 的人员配置" ${lastOwner?'disabled title="请先指定另一名系统所有者"':""}>删除</button></td></tr>`;

    function historyPanel(){return `<header class="top"><div><div class="title">历史查询</div><div class="sub">版本历史数据 · 已选择留档并确认上线的版本 · 演示数据</div></div></header><iframe id="history-frame" title="历史复盘三层原型" style="display:block;width:100%;height:700px;border:0;background:#f4f6f9"></iframe>`}
    async function mountHistoryFrame(){const frame=document.getElementById("history-frame");if(!frame)return;try{const bytes=Uint8Array.from(atob(historyPrototypeGzip),c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();if(!frame.isConnected)return;frame.onload=()=>frame.contentWindow.postMessage({kind:"history-init",page:state.historyPage,version:state.historyVersion,requirement:state.historyRequirement},"*");frame.srcdoc=html}catch(error){frame.outerHTML='<div class="content"><div class="notice">历史原型无法加载；请使用支持 DecompressionStream 的浏览器打开此 HTML。</div></div>';console.error("History prototype load failed",error)}}
    addEventListener("message",event=>{const frame=document.getElementById("history-frame");if(!frame||event.source!==frame.contentWindow)return;const data=event.data;if(data?.kind==="history-height"&&Number.isFinite(data.height)){frame.style.height=`${Math.max(700,data.height)}px`;return}if(data?.kind==="history-navigate"){state.historyPage=data.page;state.historyVersion=data.version;state.historyRequirement=data.requirement;const url=new URL(location.href);url.searchParams.set("page","history");url.searchParams.set("historyPage",data.page);url.searchParams.set("historyVersion",data.version);url.searchParams.set("historyRequirement",data.requirement);history.replaceState(null,"",url);scrollTo(0,0)}});
