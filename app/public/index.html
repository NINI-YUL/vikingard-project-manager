<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VikingPM · 版本协同中心</title>
  <link rel="stylesheet" href="/shell.css">
  <script type="module" src="/shell.js"></script>
</head>
<body>
  <div id="boot" class="boot" role="status" aria-live="polite">正在检查服务与登录状态…</div>

  <section id="login-view" class="login-view" hidden aria-labelledby="login-title">
    <div class="login-card">
      <div class="brand brand-login"><span class="mark">V</span><span>版本协同中心</span></div>
      <h1 id="login-title">使用钉钉确认身份</h1>
      <p id="login-message">仅已核对企业身份并明确授权的人员可访问。首个登录者不会自动成为所有者。</p>
      <a id="login-link" class="button button-primary" href="/auth/dingtalk/start">钉钉登录</a>
      <p class="muted"><a href="/acceptance">进入功能验收入口</a></p>
    </div>
  </section>

  <div id="app" class="shell" hidden>
    <aside class="side">
      <div class="brand"><span class="mark">V</span><span>版本协同中心</span></div>

      <div class="nav-label">日常管理</div>
      <nav aria-label="日常管理">
        <a class="nav" href="#/action" data-route="action"><svg class="nav-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"></rect><rect width="7" height="5" x="14" y="3" rx="1"></rect><rect width="7" height="9" x="14" y="12" rx="1"></rect><rect width="7" height="5" x="3" y="16" rx="1"></rect></svg>行动中心</a>
        <a class="nav" href="#/versions" data-route="versions"><svg class="nav-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg>版本</a>
        <a class="nav" href="#/requirements" data-route="requirements"><svg class="nav-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><rect x="3" y="4" width="6" height="6" rx="1"></rect></svg>需求</a>
        <a class="nav" href="#/people" data-route="people"><svg class="nav-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><path d="M16 3.128a4 4 0 0 1 0 7.744"></path><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><circle cx="9" cy="7" r="4"></circle></svg>人员</a>
        <a class="nav" href="#/anomalies" data-route="anomalies"><svg class="nav-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>异常与审计<span id="anomaly-badge" class="nav-badge" hidden></span></a>
      </nav>

      <div class="nav-label">分析</div>
      <nav aria-label="分析">
        <a class="nav" href="#/participation" data-route="participation"><svg class="nav-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16v5"></path><path d="M16 14v7"></path><path d="M20 10v11"></path><path d="m22 3-8.646 8.646a.5.5 0 0 1-.708 0L9.354 8.354a.5.5 0 0 0-.707 0L2 15"></path><path d="M4 18v3"></path><path d="M8 14v7"></path></svg>人力参与度</a>
      </nav>

      <div class="nav-label">系统管理</div>
      <nav aria-label="系统管理">
        <a class="nav" href="#/config" data-route="config"><svg class="nav-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 17H5"></path><path d="M19 7h-9"></path><circle cx="17" cy="17" r="3"></circle><circle cx="7" cy="7" r="3"></circle></svg>配置库</a>
        <a class="nav" href="#/history" data-route="history"><svg class="nav-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></svg>历史查询</a>
      </nav>

      <div class="side-foot">
        <a class="nav nav-acceptance" href="/acceptance" data-route="acceptance">功能验收</a>
        <p id="side-user" class="side-user"></p>
        <button id="logout" class="link-button" type="button">退出登录</button>
      </div>
    </aside>

    <div class="main">
      <header class="top">
        <div class="heading">
          <h1 id="page-title" class="title">行动中心</h1>
          <div id="page-sub" class="sub">全部活跃版本 · 风险与到期</div>
        </div>
        <div class="toolbar">
          <label class="select-label" for="version-select"><span class="sr-only">版本</span>
            <select id="version-select" class="select" aria-label="切换版本"></select>
          </label>
          <details id="function-filter" class="function-filter" hidden>
            <summary id="function-summary">职能：全部</summary>
            <fieldset id="function-options"><legend class="sr-only">筛选职能，可多选</legend></fieldset>
          </details>
          <div id="source-sync-controls" class="source-sync-controls" hidden>
          <button id="tb-sync" class="button button-primary sync-button" type="button" hidden>获取最新TB</button>
          <button id="feedback-sync" class="button sync-button" type="button" hidden>获取最新反馈</button>
          </div>
          <span id="role-chip" class="sr-only"></span>
        </div>
      </header>
      <div id="message" class="message" role="status" aria-live="polite" aria-atomic="true" hidden></div>
      <main id="view" class="content" tabindex="-1"></main>
    </div>
  </div>

  <noscript><p class="noscript">本系统需要启用 JavaScript。</p></noscript>
</body>
</html>
